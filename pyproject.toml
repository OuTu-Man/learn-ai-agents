[tool.poetry]
name = "learn-ai-agents"
version = "0.1.0"
description = "Learn ai agents"
authors = ["Ou Tu Man"]
packages = [{ include = "apps" }]

[tool.poetry.dependencies]
python = ">=3.14,<4.0.0"
langchain-ollama = ">=1.1.0,<2.0.0"
openai = ">=2.53.0,<3.0.0"
langchain-openai = ">=1.4.2,<2.0.0"
pydantic = ">=2.13.4,<3.0.0"
langchain = "^1.3.14"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
ruff = ">=0.16.2,<0.17.0"
black = ">=26.5.1,<27.0.0"

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
